<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-61798556-ec1f-456b-bc98-0c3fb5de5973/styles.css">
<script src="_ds/organic-61798556-ec1f-456b-bc98-0c3fb5de5973/_ds_bundle.js"></script>
<style>body{margin:0;background:var(--color-neutral-200)}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}</style>
</helmet>
<div style="display:flex;justify-content:center;padding:24px">
  <div data-screen-label="Loading" style="width:390px;height:844px;flex:none;border-radius:36px;overflow:hidden;position:relative;background:var(--color-bg);color:var(--color-text);box-shadow:var(--shadow-lg);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px">
    <div style="width:300px;height:380px;flex:none">{{ tree }}</div>
    <sc-if value="{{ showCaption }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;opacity:{{ fade }}">
        <div style="font-family:var(--font-heading);font-size:22px;line-height:1.1;color:var(--color-text)">{{ caption }}</div>
        <div style="width:160px;height:8px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden"><div style="height:100%;width:{{ pct }};border-radius:999px;background:var(--color-accent)"></div></div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:892},&quot;food&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pantry&quot;,&quot;fruit&quot;],&quot;default&quot;:&quot;pantry&quot;,&quot;tsType&quot;:&quot;'pantry'|'fruit'&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:4,&quot;max&quot;:14,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;},&quot;loop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const E = React.createElement;
const ease = x => 1 - Math.pow(1 - x, 3);
const back = x => { if (x <= 0) return 0; const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const v = n => `var(--color-${n})`;
const TRUNK = [[150, 318], [146, 270], [156, 220], [150, 168]];
const bez = (p, u) => { const m = 1 - u; return [0, 1].map(k => m*m*m*p[0][k] + 3*m*m*u*p[1][k] + 3*m*u*u*p[2][k] + u*u*u*p[3][k]); };
const BRANCHES = [
  { d: 'M150 252 C 130 238, 112 224, 96 200', a: 0.34, w: 8 },
  { d: 'M151 228 C 172 214, 190 198, 206 176', a: 0.38, w: 8 },
  { d: 'M150 200 C 136 184, 124 168, 118 146', a: 0.42, w: 6 },
  { d: 'M151 194 C 165 178, 176 162, 182 140', a: 0.45, w: 6 },
];
const CANOPY = [
  [100, 172, 40, 'accent-2-600'], [202, 166, 42, 'accent-2-600'], [80, 196, 26, 'accent-2-700'], [224, 190, 28, 'accent-2-700'],
  [150, 142, 54, 'accent-2-500'], [120, 120, 38, 'accent-2-400'], [182, 118, 38, 'accent-2-500'], [150, 98, 40, 'accent-2-400'],
];
const SPOTS = [[110, 152], [190, 142], [150, 122], [92, 186], [212, 182], [140, 172], [172, 96], [126, 104]];
const PANTRY = ['🍅', '🥕', '🧀', '🍋', '🥖', '🍄', '🥑', '🌶️'];
const FRUIT = ['accent-500', 'accent-600', 'accent-400', 'accent-500', 'accent-600', 'accent-400', 'accent-500', 'accent-600'];
const SOIL = [[118, 314], [140, 306], [164, 310], [186, 315], [150, 316]];

class Component extends DCLogic {
  state = { el: 0 };
  componentDidMount() {
    this.start = performance.now();
    const tick = now => { this.setState({ el: now - this.start }); this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const D = (this.props.duration ?? 7) * 1000, loop = this.props.loop ?? true, mode = this.props.food ?? 'pantry';
    let el = this.state.el;
    if (loop) el = el % (D + 700); else el = Math.min(el, D);
    const t = Math.min(1, el / D);
    const fade = loop && el > D ? 1 - seg(el, D, D + 450) : 1;

    const h = 34 * ease(seg(t, 0, 0.1));
    const L = t < 0.22 ? 0.18 * ease(seg(t, 0.08, 0.22)) : 0.18 + 0.82 * ease(seg(t, 0.22, 0.5));
    const tip = bez(TRUNK, Math.max(L, 0.001));
    const ls = back(seg(t, 0.12, 0.22)) * (1 - seg(t, 0.48, 0.58));
    const sway = Math.sin(el / 900) * 1.4 * seg(t, 0.5, 0.8);

    const kids = [];
    if (L > 0) kids.push(E('path', { key: 'trunk', d: `M${TRUNK[0]} C ${TRUNK[1]}, ${TRUNK[2]}, ${TRUNK[3]}`, pathLength: 1, fill: 'none', strokeLinecap: 'round',
      style: { stroke: v('accent-900'), strokeWidth: 4 + 12 * ease(seg(t, 0.2, 0.6)), strokeDasharray: 1, strokeDashoffset: 1 - L } }));
    BRANCHES.forEach((b, i) => { const p = ease(seg(t, b.a, b.a + 0.12)); if (p > 0) kids.push(E('path', { key: 'b' + i, d: b.d, pathLength: 1, fill: 'none', strokeLinecap: 'round',
      style: { stroke: v('accent-900'), strokeWidth: b.w, strokeDasharray: 1, strokeDashoffset: 1 - p } })); });
    if (ls > 0) kids.push(E('g', { key: 'leaves', transform: `translate(${tip[0]} ${tip[1]}) scale(${ls})` },
      E('ellipse', { cx: -9, cy: -3, rx: 10, ry: 4.5, transform: 'rotate(-28 -9 -3)', style: { fill: v('accent-2-500') } }),
      E('ellipse', { cx: 9, cy: -6, rx: 10, ry: 4.5, transform: 'rotate(28 9 -6)', style: { fill: v('accent-2-400') } })));
    CANOPY.forEach(([x, y, r, c], i) => { const a = 0.46 + i * 0.03, s = back(seg(t, a, a + 0.14)); if (s > 0) kids.push(E('circle', { key: 'c' + i, cx: x, cy: y, r: r * s, style: { fill: v(c) } })); });
    SPOTS.forEach(([x, y], i) => {
      const a = 0.7 + i * 0.022, s = back(seg(t, a, a + 0.08)); if (s <= 0) return;
      const bob = Math.sin(el / 600 + i) * 1.2 * seg(t, 0.9, 1);
      kids.push(E('g', { key: 'f' + i, transform: `translate(${x} ${y + bob}) scale(${s})` }, mode === 'fruit'
        ? [E('path', { key: 's', d: 'M0 -8 Q 1 -13, 4 -15', fill: 'none', strokeLinecap: 'round', style: { stroke: v('accent-900'), strokeWidth: 2 } }),
           E('circle', { key: 'o', r: 9, style: { fill: v(FRUIT[i]) } }),
           E('circle', { key: 'h', cx: -3, cy: -3, r: 2.6, style: { fill: v('accent-200'), opacity: 0.8 } })]
        : E('text', { textAnchor: 'middle', dominantBaseline: 'central', style: { fontSize: 22 } }, PANTRY[i])));
    });

    const ground = [
      E('ellipse', { key: 'sh', cx: 150, cy: 324, rx: 120 * ease(seg(t, 0, 0.1)), ry: 9, style: { fill: v('neutral-300') } }),
    ];
    const mound = [E('path', { key: 'm', d: `M56 324 C 92 ${324 - h}, 208 ${324 - h}, 244 324 Z`, style: { fill: v('accent-700') } }),
      ...SOIL.map(([x, y], i) => E('circle', { key: 'd' + i, cx: x, cy: y + (1 - seg(t, 0.04, 0.1)) * 14, r: 2.4 * seg(t, 0.04, 0.1), style: { fill: v('accent-800') } }))];

    const tree = E('svg', { viewBox: '0 0 300 380', width: 300, height: 380, style: { display: 'block', overflow: 'visible', opacity: fade } },
      ...ground, E('g', { transform: `rotate(${sway} 150 318)` }, ...kids), ...mound);

    const caption = t < 0.1 ? 'Turning the soil' : t < 0.34 ? 'Putting down roots' : t < 0.68 ? 'Branching out' : 'Ripening';
    return { tree, caption, fade, pct: Math.round(ease(t) * 100) + '%', showCaption: this.props.caption ?? true };
  }
}
</script>
</body>
</html>
